# Site da documentação (docs.prumo.matizze.com.br), a cada push na `main` que muda a documentação.
#
# Gera a imagem (website/Dockerfile: o Docusaurus gera o HTML de docs/ e o nginx o serve), testa a
# imagem, envia para o ghcr.io/matizze/prumo-docs e chama o webhook do Portainer, que baixa a imagem
# nova e reinicia o serviço prumo-docs_web. Só roda quando docs/ ou website/ mudam, para não gastar
# minutos do Actions à toa. Aprovado por uma pessoa do time em 22/11/2026.
name: Documentação

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  image:
    name: Imagem do site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/matizze/prumo-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Imagem
        run: docker build -f website/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}" .

      - name: Teste da imagem
        run: website/docker/smoke-test.sh "$IMAGE:latest"

      - name: Login no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Envio para o GHCR
        run: docker push --all-tags "$IMAGE"

      - name: Deploy (webhook do Portainer)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_DOCS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Falta o secret PORTAINER_WEBHOOK_DOCS: a imagem foi enviada, mas o site não foi atualizado."
            exit 0
          fi
          curl -fsS -X POST --retry 3 --retry-all-errors "$WEBHOOK"
          echo "Webhook chamado: o Portainer baixa a latest e reinicia o serviço prumo-docs_web."
